name: Terragrunt CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hcl-validation:
    name: Terragrunt HCL validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.9.8"
          terraform_wrapper: false

      - name: Install Terragrunt
        env:
          TERRAGRUNT_VERSION: "0.77.22"
        run: |
          set -euo pipefail

          curl -sSfL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o terragrunt

          chmod +x terragrunt
          sudo mv terragrunt /usr/local/bin/terragrunt

          terragrunt --version

      - name: Check HCL formatting
        run: terragrunt hcl fmt --check

      - name: Validate environment HCL
        run: |
          set -euo pipefail

          for environment in dev qa stage prod; do
            terragrunt hcl validate \
              --working-dir "live/${environment}/networking"
          done
