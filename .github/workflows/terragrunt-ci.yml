name: Terragrunt CI/CD

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Environment to validate
        required: true
        type: choice
        options:
          - dev
          - qa
          - stage
          - prod

permissions:
  contents: read

concurrency:
  group: terragrunt-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  TERRAFORM_VERSION: "1.9.8"
  TERRAGRUNT_VERSION: "0.77.22"

jobs:
  validate:
    name: Validate ${{ matrix.environment }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        environment:
          - dev
          - qa
          - stage
          - prod

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false

      - name: Install Terragrunt
        shell: bash
        run: |
          set -euo pipefail

          curl -sSfL \
            "https://github.com/gruntwork-io/terragrunt/releases/download/v${TERRAGRUNT_VERSION}/terragrunt_linux_amd64" \
            -o terragrunt

          chmod +x terragrunt
          sudo install terragrunt /usr/local/bin/terragrunt

          terragrunt --version
          terraform version

      - name: Check Terragrunt formatting
        run: terragrunt hcl fmt --check

      - name: Validate Terragrunt configuration
        run: |
          set -euo pipefail

          terragrunt hcl validate \
            --working-dir "live/${{ matrix.environment }}/networking"

  deployment-gate:
    name: Deployment safety gate
    runs-on: ubuntu-latest
    needs: validate
    if: github.event_name == 'workflow_dispatch'

    steps:
      - name: Confirm deployment is disabled
        run: |
          echo "All environments passed configuration validation."
          echo "Selected environment: ${{ inputs.environment }}"
          echo "Terraform plan/apply is not enabled in this workflow."
          echo "No infrastructure was deployed."